{% extends "base.html" %}

{% block title %}System Error (500) – {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 text-danger fw-bold">500</div>
    <h2 class="fw-bold mb-3">Internal System Error</h2>
    <p class="text-muted mb-4">An unexpected system error occurred while processing your request. Please try again shortly.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary px-4 py-2">
      ← Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
