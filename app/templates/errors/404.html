{% extends "base.html" %}

{% block title %}Page Not Found (404) – {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 text-primary fw-bold">404</div>
    <h2 class="fw-bold mb-3">Service or Page Not Found</h2>
    <p class="text-muted mb-4">{{ message or "The page or public service you requested could not be located." }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2">
      ← Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
