# ==============================================================================
# SevaPath Production Nginx Configuration
# Reverse Proxy, TLS Termination & Static Asset Offloading
# ==============================================================================

# Upstream Gunicorn WSGI server bound to loopback
upstream sevapath_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# 1. HTTP -> HTTPS Redirection (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name __SEVAPATH_DOMAIN__;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SEVAPATH_DOMAIN__;

    # TLS Certificates (Provided by Certbot / Let's Encrypt)
    ssl_certificate __SSL_CERT_PATH__;          # e.g., /etc/letsencrypt/live/__SEVAPATH_DOMAIN__/fullchain.pem
    ssl_certificate_key __SSL_KEY_PATH__;        # e.g., /etc/letsencrypt/live/__SEVAPATH_DOMAIN__/privkey.pem
    ssl_trusted_certificate __SSL_CHAIN_PATH__; # e.g., /etc/letsencrypt/live/__SEVAPATH_DOMAIN__/chain.pem

    # Modern TLS Security Policies (Mozilla Intermediate Baseline)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Request Boundary Enforcement (Matches Flask MAX_CONTENT_LENGTH = 1MB)
    client_max_body_size 1M;
    client_body_buffer_size 128k;

    # Gzip Compression for Mobile Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 3. Static Asset Offloading (/static/)
    # Assets are served directly by Nginx with revalidation cache policy
    location /static/ {
        alias __SEVAPATH_STATIC_DIR__/; # e.g., /opt/sevapath/current/app/static/
        
        # 1-day client cache with mandatory server revalidation for unhashed assets
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # 4. Health Check Routing
    location /health {
        proxy_pass http://sevapath_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 5. Core Application Reverse Proxy
    location / {
        proxy_pass http://sevapath_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Single-Hop ProxyFix Trust Directives
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Defense-in-depth: discard untrusted forwarded headers
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";

        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
